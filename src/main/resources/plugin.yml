name: EternalRelics
version: 1.0.0
main: com.itzeneatg.eternalrelics.EternalRelics
description: Legendary items and event server plugin for Paper 1.21.11
authors:
  - itzeneatg
api-version: "1.21"
support: https://github.com/itzeneatg/eternal-relics

commands:
  altar:
    description: Admin command to manage altars
    usage: /altar <helmet|chestplate|leggings|boots|weapon|open|close|status>
    permission: eternalrelics.admin.altar
  
  event:
    description: Admin command to manage events
    usage: /event <helmet|chestplate|leggings|boots|awakening|open|close|status>
    permission: eternalrelics.admin.event
  
  void:
    description: Void faction commands
    usage: /void <awaken|members|status>
    permission: eternalrelics.void
  
  king:
    description: Human faction king command
    usage: /king <player>
    permission: eternalrelics.admin.king
  
  recipes:
    description: Open the legendary recipes GUI
    usage: /recipes
    permission: eternalrelics.recipes
  
  relicinfo:
    description: Get information about legendary items
    usage: /relicinfo
    permission: eternalrelics.info

permissions:
  eternalrelics.admin:
    description: Full admin access to EternalRelics
    children:
      eternalrelics.admin.altar: true
      eternalrelics.admin.event: true
      eternalrelics.admin.king: true
  eternalrelics.admin.altar:
    description: Manage altars
    default: op
  eternalrelics.admin.event:
    description: Manage events
    default: op
  eternalrelics.admin.king:
    description: Manage king faction
    default: op
  eternalrelics.void:
    description: Access void faction commands
    default: false
  eternalrelics.recipes:
    description: View legendary recipes
    default: true
  eternalrelics.info:
    description: View relic information
    default: true